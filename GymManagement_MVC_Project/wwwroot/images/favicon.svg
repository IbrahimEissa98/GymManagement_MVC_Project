<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <style>
    .navy-fill { fill: #00086B; }
    .navy-stroke { stroke: #00086B; fill: none; }
    .text-style {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-weight: 900;
      fill: #00086B;
      letter-spacing: 2px;
    }
  </style>

  <!-- Graphics Group -->
  <g id="dumbbell-arm" class="navy-fill">
    <!-- Horizontal Dumbbell -->
    <!-- Left Plates -->
    <rect x="115" y="110" width="15" height="60" rx="3" />
    <rect x="133" y="95" width="25" height="90" rx="5" />
    
    <!-- Right Plates -->
    <rect x="342" y="95" width="25" height="90" rx="5" />
    <rect x="370" y="110" width="15" height="60" rx="3" />
    
    <!-- Dumbbell Bar -->
    <rect x="158" y="132" width="184" height="16" rx="3" />

    <!-- Knuckles & Fist Grip -->
    <path d="M 215 125 C 215 115, 230 110, 235 125 L 235 142 L 215 142 Z" />
    <path d="M 237 122 C 237 110, 252 108, 255 122 L 255 142 L 237 142 Z" />
    <path d="M 257 122 C 257 110, 272 108, 275 122 L 275 142 L 257 142 Z" />
    <path d="M 277 125 C 277 115, 290 115, 290 128 L 290 142 L 277 142 Z" />
    
    <!-- Thumb & Palm Wrap -->
    <path d="M 210 142 C 200 142, 195 158, 210 168 C 225 178, 255 175, 285 168 C 295 162, 295 142, 285 142 Z" />

    <!-- Muscular Forearm -->
    <path d="M 215 168 C 205 195, 190 225, 195 265 C 200 305, 215 335, 225 365 L 242 365 C 237 325, 232 295, 242 265 C 247 245, 249 225, 247 205 Z" />
    <path d="M 285 168 C 295 195, 310 225, 305 265 C 300 305, 285 335, 275 365 L 258 365 C 263 325, 268 295, 258 265 C 253 245, 251 225, 253 205 Z" />
    
    <!-- Inner Muscle Lines -->
    <path d="M 232 205 Q 247 245, 239 295 Q 235 325, 242 360" class="navy-stroke" stroke-width="4" stroke-linecap="round"/>
    <path d="M 268 205 Q 253 245, 261 295 Q 265 325, 258 360" class="navy-stroke" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g id="logo-text">
    <!-- Top Decorative Line -->
    <line x1="70" y1="390" x2="430" y2="390" stroke="#00086B" stroke-width="4" stroke-linecap="round" />
    
    <!-- Text -->
    <text x="250" y="435" text-anchor="middle" font-size="38" class="text-style">POWER FITNESS</text>
    
    <!-- Bottom Decorative Line -->
    <line x1="120" y1="455" x2="380" y2="455" stroke="#00086B" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
